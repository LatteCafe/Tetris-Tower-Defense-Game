<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tetris Clone</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="game-container">
  <canvas id="canvas"></canvas>

  <div id="hud">
    <div class="hud-cluster">
      <div class="stat-pill">
        <span class="label">Time</span>
        <span class="value" id="stat-timer">00:00</span>
      </div>
      <div class="stat-pill">
        <span class="label">Score</span>
        <span class="value" id="stat-score">0</span>
      </div>
      <div class="stat-pill">
        <span class="label">Lines</span>
        <span class="value" id="stat-lines">0</span>
      </div>
      <div class="stat-pill">
        <span class="label">Level</span>
        <span class="value" id="stat-level">1</span>
      </div>
    </div>

    <div id="next-piece">
      <span class="label" style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);">Next</span>
      <div id="next-swatch"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <div id="overlay" class="overlay">
    <div id="screen-start" class="panel">
      <h1>Tetris</h1>
      <p>Classic grid-based Tetris — clear lines to score, speed picks up
        every level. You start with a random pile already at the bottom,
        so it's not a clean slate.</p>
      <div class="controls-hint">← → move &nbsp;·&nbsp; ↑ rotate CW &nbsp;·&nbsp; Z rotate CCW &nbsp;·&nbsp; ↓ soft drop &nbsp;·&nbsp; Space hard drop</div>
      <button id="btn-start" class="btn">Start Game</button>
    </div>

    <div id="screen-gameover" class="panel hidden">
      <h2>Game Over</h2>
      <p id="gameover-stats"></p>
      <button id="btn-retry" class="btn">Try Again</button>
    </div>
  </div>
</div>

<script src="js/pieces.js"></script>
<script src="js/board.js"></script>
<script src="js/input.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
